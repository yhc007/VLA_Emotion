[package]
name = "vla-psych-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "VLA Psychological Analysis Agent - Real-time speech & facial expression analysis with SPO semantic graph"

[dependencies]
# pekko-agent core crates
pekko-agent-core = { path = "../../crates/pekko-agent-core" }
pekko-agent-llm = { path = "../../crates/pekko-agent-llm" }
pekko-agent-tools = { path = "../../crates/pekko-agent-tools" }
pekko-agent-memory = { path = "../../crates/pekko-agent-memory" }
pekko-agent-events = { path = "../../crates/pekko-agent-events" }
pekko-agent-orchestrator = { path = "../../crates/pekko-agent-orchestrator" }
pekko-agent-security = { path = "../../crates/pekko-agent-security" }

# Async runtime
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# HTTP (WebSocket for real-time streaming)
axum = { workspace = true, features = ["ws"] }
tower.workspace = true
tower-http.workspace = true

# Utilities
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
thiserror.workspace = true
anyhow.workspace = true

# Observability
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

# Graph engine
petgraph = "0.6"
